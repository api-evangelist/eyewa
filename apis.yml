aid: eyewa
name: Eyewa
description: >-
  Eyewa is an online-first eyewear retailer serving the Middle East, selling
  prescription eyeglasses, sunglasses, clear and colored contact lenses, eyewear
  accessories, and eye-health vitamins through its e-commerce storefront and a
  network of 260+ physical stores with click-and-collect. Headquartered in
  Dubai, UAE, Eyewa operates across the GCC and offers regional payment options
  such as Tabby, Tamara, and Apple Pay. It was added to the API Evangelist
  network as a portfolio company of 500 Global. Eyewa publishes a consumer
  storefront, an educational vision-and-eyewear blog, and standard commercial
  policy pages, but does not currently expose a public developer API, SDKs, or
  documented API surface.
